<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Smart Assistant</title>
    <style>
        /* CSS Giao diện Steam Dark Mode */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1b2838; color: #c7d5e0; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Màn hình Đăng nhập (Mới) */
        .login-container { width: 100%; max-width: 400px; background-color: #171a21; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .login-container h2 { color: #fff; margin-top: 0; margin-bottom: 20px; }
        .login-container input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #3c4c5a; background-color: #1b2838; color: #fff; outline: none; }
        .login-container button { background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%); color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 96%; }
        .login-container button:hover { background: linear-gradient(to right, #47bfff 5%, #1a44c2 80%); }

        /* Màn hình Chat */
        .chat-container { width: 100%; max-width: 600px; height: 90vh; background-color: #171a21; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; }
        .header { background: linear-gradient(to right, #1a9fff, #2a475e); padding: 15px 20px; color: white; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .header span { font-size: 0.9rem; font-weight: normal; opacity: 0.8; }
        .header .btn-logout { background-color: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .header .btn-logout:hover { background-color: rgba(255,255,255,0.1); }
        
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Tin nhắn & Thẻ Game */
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background-color: #2a475e; color: #fff; }
        .msg.bot { align-self: flex-start; background-color: #202a36; border-left: 4px solid #66c0f4; }
        .game-card { background-color: #1b2838; border: 1px solid #3c4c5a; border-radius: 6px; padding: 12px; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .game-title { font-weight: bold; color: #fff; font-size: 1.1rem; margin-bottom: 5px; }
        .game-reason { font-size: 0.9rem; color: #acb2b8; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; }
        .badge.history { background-color: #d95b43; color: white; }
        .badge.keyword { background-color: #66c0f4; color: #1b2838; }
        .btn-link { display: inline-block; background-color: #5c7e10; color: #d2efa9; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; transition: 0.2s; }
        .btn-link:hover { background-color: #6b9311; }

        /* Khung nhập liệu */
        .input-area { display: flex; padding: 15px; background-color: #171a21; border-top: 1px solid #2a475e; }
        .input-area input { flex: 1; padding: 12px; border-radius: 4px; border: none; background-color: #1b2838; color: #fff; outline: none; }
        .input-area button { background-color: #66c0f4; color: #1b2838; border: none; padding: 0 20px; margin-left: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .input-area button:hover { background-color: #41a5e1; }
        .loading { font-style: italic; color: #66c0f4; font-size: 0.9rem; align-self: flex-start; display: none; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <h2>Khởi tạo Hệ thống</h2>
    <input type="text" id="steamIdInput" placeholder="Nhập Steam ID (VD: 76561198844741295)">
    <input type="text" id="apiUrlInput" placeholder="Link API (vd: https://abc.loca.lt)">
    <button onclick="startChat()">Kết nối Server</button>
</div>

<div id="chatScreen" class="chat-container">
    <div class="header">
        <div>Steam AI Assistant</div>
        <div>
            <span id="userInfo">ID: ...</span>
            <button class="btn-logout" onclick="logout()">Đổi ID/API</button>
        </div>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="msg bot">Chào bạn! Mình là trợ lý AI. Mình có thể giúp bạn tìm kiếm game phù hợp nhất. Bạn muốn chơi thể loại gì hôm nay?</div>
    </div>
    <div id="loadingIndicator" class="loading" style="padding-left: 20px; margin-bottom: 10px;">AI đang suy nghĩ...</div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập yêu cầu tìm game..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    let currentSessionId = "";
    let currentApiUrl = "";

    // 1. TỰ ĐỘNG ĐIỀN THÔNG TIN CŨ KHI MỞ TRANG
    window.onload = () => {
        const savedId = localStorage.getItem("steam_session_id");
        const savedApi = localStorage.getItem("steam_api_url");
        if(savedId) document.getElementById("steamIdInput").value = savedId;
        if(savedApi) document.getElementById("apiUrlInput").value = savedApi;
    };

    // 2. XỬ LÝ NÚT KẾT NÓI (LOGIN)
    function startChat() {
        const idVal = document.getElementById("steamIdInput").value.trim();
        let apiVal = document.getElementById("apiUrlInput").value.trim();

        if (!idVal) { alert("Vui lòng nhập Steam ID!"); return; }
        if (!apiVal) { alert("Vui lòng nhập Link API (Localtunnel)!"); return; }

        // Tự động thêm /api/chat nếu người dùng chỉ nhập domain gốc
        if(!apiVal.endsWith("/api/chat")) {
            // Xóa dấu / ở cuối nếu có
            if(apiVal.endsWith("/")) apiVal = apiVal.slice(0, -1);
            apiVal = apiVal + "/api/chat";
        }

        // Lưu vào biến và LocalStorage
        currentSessionId = idVal;
        currentApiUrl = apiVal;
        localStorage.setItem("steam_session_id", idVal);
        localStorage.setItem("steam_api_url", document.getElementById("apiUrlInput").value.trim());

        // Chuyển giao diện
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("chatScreen").style.display = "flex";
        document.getElementById("userInfo").innerText = `ID: ${idVal}`;
    }

    // 3. XỬ LÝ NÚT ĐĂNG XUẤT (ĐỔI CẤU HÌNH)
    function logout() {
        document.getElementById("loginScreen").style.display = "block";
        document.getElementById("chatScreen").style.display = "none";
        // Có thể reset lại chatbox nếu muốn
    }

    // 4. HÀM HIỂN THỊ TIN NHẮN UI
    function appendMessage(sender, text, games = []) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${sender}`;
        
        let htmlContent = `<div>${text.replace(/\n/g, "<br>")}</div>`;

        if (games && games.length > 0) {
            games.forEach(game => {
                const badgeClass = game.type === 'history' ? 'history' : 'keyword';
                const badgeText = game.type === 'history' ? '★ Hợp gu cũ' : '🔍 Phù hợp từ khóa';
                htmlContent += `
                    <div class="game-card">
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <div class="game-title">${game.name}</div>
                        <div class="game-reason">${game.reason}</div>
                        
                    </div>
                `;
            });
        }

        msgDiv.innerHTML = htmlContent;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 5. HÀM GỬI API CHO BACKEND
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const message = inputField.value.trim();
        if (!message) return;

        appendMessage("user", message);
        inputField.value = "";
        document.getElementById("loadingIndicator").style.display = "block";

        try {
            // SỬ DỤNG LINK API ĐỘNG TỪ MÀN HÌNH LOGIN
            const response = await fetch(currentApiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Bypass-Tunnel-Reminder": "true" },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    message: message
                })
            });

            const data = await response.json();
            document.getElementById("loadingIndicator").style.display = "none";

            if (data.status === "success" && data.agent_data) {
                const chatText = data.agent_data.chat_message || "Xin lỗi, mình không hiểu ý bạn.";
                const gameList = data.agent_data.games || [];
                appendMessage("bot", chatText, gameList);
            } else {
                appendMessage("bot", "Lỗi: Dữ liệu trả về từ Server không đúng định dạng.");
            }

        } catch (error) {
            document.getElementById("loadingIndicator").style.display = "none";
            console.error("API Error:", error);
            appendMessage("bot", `⚠️ Lỗi kết nối tới Server: ${error.message}. Hãy kiểm tra lại link API của bạn xem còn sống không nhé.`);
        }
    }

    function handleEnter(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
